name: Pico
options:
  bundleIdPrefix: com.pico
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: pl
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.pico.Pico
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_ENTITLEMENTS: Pico.entitlements
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: pl
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Pico:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        # Checked-in Info.plist (not Xcode's auto-generated one) — needed for
        # `CFBundleDocumentTypes` below, a nested array/dict structure that
        # flat `INFOPLIST_KEY_*` build settings can't express.
        # `INFOPLIST_FILE` is resolved relative to this project.yml, i.e.
        # `Pico/Info.plist`.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        COMBINE_HIDPI_IMAGES: YES
        APPLICATION_EXTENSION_API_ONLY: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
